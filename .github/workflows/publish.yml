name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Setup pnpm
        run: npm install -g pnpm@11.11.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and test
        run: pnpm run test

      - name: Get package info
        id: package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "is-prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.package.outputs.version }}
          IS_PRERELEASE: ${{ steps.package.outputs.is-prerelease }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "$IS_PRERELEASE" == "true" ]]; then PRERELEASE_FLAG="--prerelease"; fi
          gh release create "v$VERSION" --target="$GITHUB_SHA" --title="v$VERSION" --generate-notes $PRERELEASE_FLAG

      - name: Publish to npmjs next version
        if: ${{ steps.package.outputs.is-prerelease == 'true' }}
        run: npm publish --tag next

      - name: Publish to npmjs
        if: ${{ steps.package.outputs.is-prerelease == 'false' }}
        run: npm publish
